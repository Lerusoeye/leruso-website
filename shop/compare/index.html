<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare frames — Leruso Eyewear</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbf8f2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230c0b09'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' fill='%23c9a46a' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../shop.css">
</head>
<body class="shop-light">
<header class="shop-nav">
  <a href="/" class="nav__logo" aria-label="Leruso Eyewear home">LERUSO<span>EYEWEAR</span></a>
  <nav class="shop-nav__links" aria-label="Main">
    <a href="/">Home</a>
    <a href="/shop/">Shop</a>
    <a href="/shop/limited/">Limited</a>
    <a href="/shop/bag/" data-bag>Bag</a>
    <a class="btn btn--gold btn--sm" href="https://book.lerusoeyewear.com" target="_blank" rel="noopener">Book an exam</a>
  </nav>
</header>

<main class="shop-wrap">
  <p class="crumb"><a href="/shop/">Shop</a> <span aria-hidden="true">/</span> Compare</p>
  <h1 style="font:300 clamp(36px,5vw,64px)/1 var(--serif);margin:24px 0 0">Compare frames</h1>
  <div id="root"><p class="empty">Loading…</p></div>
</main>

<script src="../common.js"></script>
<script>
(async () => {
  const { fmt, esc, priceHTML, brandItems, promosReady, compare } = Shop;
  const root = document.getElementById('root');
  async function render() {
    const list = compare.get();
    if (!list.length) { root.innerHTML = '<p class="empty">Nothing to compare yet. Tap <b>+ Compare</b> on up to 3 frames in the <a href="/shop/">shop</a>.</p>'; return; }
    let legacy = null;
    const full = await Promise.all(list.map(async (x) => {
      try {
        if (x.b) return { ...x, ...(await brandItems(x.b))[x.slug] };
        legacy ||= await fetch('/shop/products.json', { cache: 'no-cache' }).then((r) => r.json());
        return { ...x, ...legacy.find((p) => p.slug === x.slug) };
      } catch { return x; }
    }));
    await promosReady;
    const size = (p) => (p.sizes || []).join(' · ').replace(/ - /g, '-') || (p.size && p.size.lens_width ? `${p.size.lens_width}□${p.size.bridge_width || '–'}-${p.size.temple_length || '–'}` : '');
    const rows = [['Size', size], ['Shape', (p) => p.shape], ['Rim', (p) => p.rim], ['Material', (p) => p.material], ['Lenses', (p) => p.lens],
      ['Colours', (p) => (p.colours || []).length || ''], ['Made in', (p) => p.madeIn],
      ['Availability', (p) => (p.inStore ? 'In the boutique · ships in 1–2 days' : 'Special order · 10–14 business days')]];
    root.innerHTML = `<div class="cmp-grid" style="--n:${full.length}">${full.map((p) => {
      const href = `/shop/product.html?p=${encodeURIComponent(p.slug)}${p.b ? '&b=' + encodeURIComponent(p.b) : ''}`;
      return `<div class="cmp-col"><a href="${href}"><img src="/${esc((p.images || [])[0] || p.img)}" alt="${esc(p.brand + ' ' + p.title)}"></a>
        <p class="eyebrow" style="margin:0">${esc(p.brand)}</p><h3 style="margin:0;font:500 13px/1.35 var(--sans);letter-spacing:.12em;text-transform:uppercase">${esc(p.title)}</h3>
        <p style="margin:0">${p.price ? priceHTML(p) : 'Price on enquiry'}</p>
        <dl>${rows.map(([k, f]) => `<dt>${k}</dt><dd>${esc(f(p) || '–')}</dd>`).join('')}</dl>
        <a class="btn btn--gold btn--sm" href="${href}">View & choose lenses</a>
        <button class="btn btn--ghost btn--sm" type="button" data-rm="${esc(p.slug)}">Remove</button></div>`; }).join('')}</div>
      ${full.length < compare.MAX ? `<p class="fine" style="margin-top:20px"><a href="/shop/" style="color:var(--gold-2)">Add ${compare.MAX - full.length === 1 ? 'one more frame' : 'more frames'} →</a></p>` : ''}`;
    root.querySelectorAll('[data-rm]').forEach((b) => b.addEventListener('click', () => { compare.remove(b.dataset.rm); render(); }));
  }
  render();
})();
</script>
</body>
</html>
